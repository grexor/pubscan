PidFile /var/www/site/dbase/run/apache2.pid
WSGISocketPrefix /var/www/site/dbase/run/run.pubscan
ServerName localhost

# no version banner in headers and error pages
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# the application never reads request bodies (all parameters travel in the query string)
LimitRequestBody 65536

<VirtualHost *:80>
    DocumentRoot /var/www/site/web

    # nothing in the mounted repository is reachable unless granted below
    <Directory /var/www/site>
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    # static site: no directory listings
    <Directory /var/www/site/web>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    # WSGI application using Python venv; request-timeout restarts the daemon if requests hang
    WSGIDaemonProcess pubscan python-home=/var/www/site/dbase/venv python-path=/var/www/site home=/var/www/site request-timeout=300 graceful-timeout=15
    WSGIProcessGroup pubscan
    # only the entry point is mapped (not the whole pubscan/ folder)
    WSGIScriptAlias /gw/index.py /var/www/site/pubscan/index.py

    <Directory /var/www/site/pubscan>
        <Files index.py>
            Require all granted
        </Files>
    </Directory>

    # Logs, rotated by size so that request floods cannot fill the disk
    # (error.log / access.log stay the current files, older ones get .1 .. .5)
    ErrorLog "|/usr/bin/rotatelogs -n 5 /var/www/site/dbase/logs/error.log 20M"
    CustomLog "|/usr/bin/rotatelogs -n 5 /var/www/site/dbase/logs/access.log 50M" combined

</VirtualHost>
